---
layout: site
---
<section class="wrap">
  <article class="page prose">
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {{ content }}
    <p class="post-back">
      {% if page.category == 'news' %}<a href="{{ '/news/' | relative_url }}">&larr; All news</a>
      {% else %}<a href="{{ '/updates/' | relative_url }}">&larr; All updates</a>{% endif %}
    </p>
  </article>
</section>
