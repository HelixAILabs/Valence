<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22" role="img" aria-label="Helix AI Labs">
  <!-- Favicon build of the helix mark used in the site nav.
       Differences from the nav version, all for legibility at 16-32px:
       - a solid paper-coloured tile, so the ink stroke cannot disappear against a dark
         browser tab and so the iOS home-screen icon is not transparent
       - strokes thickened 1.7 -> 2.2 and the mark inset slightly, because hairlines
         disappear entirely once the tile is 16px wide -->
  <rect width="22" height="22" rx="4.5" fill="#F5F6F8"/>
  <g transform="translate(11 11) scale(0.86) translate(-11 -11)">
    <path d="M3 2 C 11 6, 11 16, 3 20" stroke="#15161A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M19 2 C 11 6, 11 16, 19 20" stroke="#F0431E" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="11" cy="6" r="1.9" fill="#F0431E"/>
    <circle cx="11" cy="16" r="1.9" fill="#15161A"/>
  </g>
</svg>
